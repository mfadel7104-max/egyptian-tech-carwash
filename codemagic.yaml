workflows:
  android-debug:
    name: Egyptian Tech - Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project scaffold
        script: flutter create --platforms=android --org com.egyptiantech .
      - name: Install Flutter packages
        script: flutter pub get
      - name: Build Android debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
